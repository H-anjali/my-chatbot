<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Chatbot</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .chat-container {
    width: 420px;
    height: 640px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chat-header {
    background: #4a90e2;
    color: white;
    padding: 16px;
    font-size: 18px;
    font-weight: bold;
  }
  .chat-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
  }
  .message {
    margin-bottom: 12px;
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .user {
    background: #4a90e2;
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 4px;
  }
  .bot {
    background: #e8eaed;
    color: #222;
    margin-right: auto;
    border-bottom-left-radius: 4px;
  }
  .typing {
    color: #888;
    font-style: italic;
  }
  .chat-input {
    display: flex;
    border-top: 1px solid #ddd;
    padding: 10px;
  }
  .chat-input input {
    flex: 1;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 20px;
    outline: none;
    font-size: 14px;
  }
  .chat-input button {
    margin-left: 8px;
    padding: 10px 18px;
    background: #4a90e2;
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
  }
  .chat-input button:hover {
    background: #3a7bc8;
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">AI Chatbot</div>
  <div class="chat-messages" id="chatMessages">
    <div class="message bot">Hi! I'm your AI assistant. Ask me anything.</div>
  </div>
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const sessionId = "session-" + Math.random().toString(36).substring(2, 10);
  const chatMessages = document.getElementById("chatMessages");
  const userInput = document.getElementById("userInput");

  function appendMessage(text, sender) {
    const div = document.createElement("div");
    div.className = "message " + sender;
    div.textContent = text;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;
    userInput.value = "";
    appendMessage(text, "user");

    const typingDiv = appendMessage("typing...", "bot typing");

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: sessionId })
      });
      const data = await res.json();
      typingDiv.remove();
      appendMessage(data.reply, "bot");
    } catch (err) {
      typingDiv.remove();
      appendMessage("Error: could not reach server.", "bot");
    }
  }
</script>

</body>
</html>
